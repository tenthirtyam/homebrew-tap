---
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing an issue, please [search the existing discussions](https://github.com/tenthirtyam/homebrew-tap/discussions?discussions_q=is%3Aopen+label%3Abug) (open or closed), and use the [reaction](https://github.blog/2016-03-10-add-reactions-to-pull-requests-issues-and-comments/) feature to add up-votes to existing discussions.

        When filing a discussion, please include the following information.
  - type: input
    id: formula
    attributes:
      label: Formula
      description: Which formula are you installing or upgrading?
      placeholder: e.g. artifactory-content-library
    validations:
      required: true
  - type: input
    id: brew-version
    attributes:
      label: Homebrew Version
      description: Output of `brew --version`.
      placeholder: e.g. Homebrew 4.x.x
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please provide a clear and concise description of the issue you are experiencing.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The `brew` command you ran.
      placeholder: |
        brew install tenthirtyam/tap/artifactory-content-library
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: |
        Please provide a link to a [GitHub Gist](https://gist.github.com/) containing the complete brew output (`brew install -v ...` when useful).
      placeholder: |
        Link to a GitHub Gist. Please do not paste large debug output in the discussion.
    validations:
      required: false
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What is it you expected to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened that's different from the expected behavior?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Please provide any related GitHub issues, discussions, or pull requests (open or closed) or documentation.
      placeholder: |
        #GH-0000
    validations:
      required: false
