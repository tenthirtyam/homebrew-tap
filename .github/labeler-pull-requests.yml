---
chore:
  - changed-files:
      - any-glob-to-any-file:
          - ".editorconfig"
          - ".github/**/*.yml"
          - ".gitattributes"
          - ".gitignore"
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "UNLICENSE"
          - "NOTICE.md"
github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**/*"
formula:
  - changed-files:
      - any-glob-to-any-file:
          - "Formula/**/*"
needs-review:
  - changed-files:
      - any-glob-to-any-file:
          - "**"
