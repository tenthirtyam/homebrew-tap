---
version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/.github/workflows'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci):'
      include: 'scope'
    labels:
      - 'chore'
      - 'github-actions'
    groups:
      github-actions:
        patterns:
          - '*'
